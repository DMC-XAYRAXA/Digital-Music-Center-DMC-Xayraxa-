    <title>DMC Xayraxa Super App</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (
          window.location.hostname.endsWith('github.io') &&
          document.querySelector('script[src="/src/main.tsx"]')
        ) {
          var pathParts = window.location.pathname.split('/').filter(Boolean);
          var owner = window.location.hostname.split('.')[0];
          var repo = pathParts[0] || '';
          var settingsUrl = repo
            ? 'https://github.com/' + owner + '/' + repo + '/settings/pages'
            : 'https://github.com';
          var actionsUrl = repo
            ? 'https://github.com/' + owner + '/' + repo + '/actions'
            : 'https://github.com';
          var rootEl = document.getElementById('root');
          if (rootEl) {
            rootEl.innerHTML =
              '<div class="min-h-screen flex items-center justify-center p-6" style="background:#020617;color:#f8fafc;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">' +
              '<div style="max-width:560px;width:100%;background:#0f172a;border:2px solid #f59e0b;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,0.8);">' +
              '<div style="color:#fbbf24;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">DMC XAYRAXA SUPER APP • GITHUB PAGES SETUP</div>' +
              '<h1 style="font-size:22px;font-weight:800;margin:0 0 12px 0;color:#ffffff;">1 Final Click to Launch Your Live App</h1>' +
              '<p style="font-size:14px;line-height:1.6;color:#cbd5e1;margin:0 0 18px 0;">GitHub Pages is currently serving the uncompiled <code>main</code> source branch. Because this is a React + TypeScript (Vite) app, switch GitHub Pages to use <strong>GitHub Actions</strong> (or the <strong>gh-pages</strong> branch):</p>' +
              '<ol style="font-size:14px;line-height:1.8;color:#e2e8f0;margin:0 0 22px 0;padding-left:20px;">' +
              '<li>Click <strong>Open GitHub Pages Settings</strong> below.</li>' +
              '<li>Under <strong>Build and deployment → Source</strong>, change <em>Deploy from a branch</em> to <strong>GitHub Actions</strong> (or select the <strong>gh-pages</strong> branch).</li>' +
              '<li>Wait ~30 seconds for the build in the Actions tab, then refresh this page!</li>' +
              '</ol>' +
              '<div style="display:flex;flex-wrap:wrap;gap:12px;">' +
              '<a href="' + settingsUrl + '" target="_blank" rel="noopener noreferrer" style="background:#f59e0b;color:#020617;font-weight:800;font-size:14px;padding:12px 18px;border-radius:12px;text-decoration:none;display:inline-block;">1. Open GitHub Pages Settings →</a>' +
              '<a href="' + actionsUrl + '" target="_blank" rel="noopener noreferrer" style="background:#1e293b;color:#f8fafc;border:1px solid #334155;font-weight:700;font-size:14px;padding:12px 18px;border-radius:12px;text-decoration:none;display:inline-block;">2. View Build Progress (Actions)</a>' +
              '</div>' +
              '</div>' +
              '</div>';
          }
        }
      })();
    </script>
  </body>
</html>
